# Render Blueprint: game server + web client in one free Docker web service.
# Render > New > Blueprint > pick this repo. The game is then at https://<name>.onrender.com
# Free services sleep after 15 idle minutes and take up to a minute to wake (the menu explains this).
services:
  - type: web
    name: blitz-buggies
    runtime: docker
    plan: free
    # Nearest to your players (ping measured from India: singapore ~80 ms, frankfurt ~167 ms, US 240+ ms).
    # Render can't move an existing service: delete it, then Manual Sync the Blueprint to recreate it here.
    region: singapore # oregon | ohio | virginia | frankfurt | singapore
    healthCheckPath: /health
    autoDeploy: true
