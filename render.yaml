# Render Blueprint: game server + web client in one free Docker web service.
# Render > New > Blueprint > pick this repo. The game is then at https://<name>.onrender.com
# Free services sleep after 15 idle minutes and take up to a minute to wake (the menu explains this).
services:
  - type: web
    name: blitz-buggies
    runtime: docker
    plan: free
    # Frankfurt: best single region for portal players (Europe 10-40 ms, US East ~90 ms; India ~167 ms).
    # Render can't move an existing service: delete it and create it again to change region.
    region: frankfurt # oregon | ohio | virginia | frankfurt | singapore
    healthCheckPath: /health
    autoDeploy: true
